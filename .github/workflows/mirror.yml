name: Mirror to Codeberg

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two mirror runs at once race on the target's refs and one fails with
# "incorrect old value provided". Serialise them; never cancel a running mirror.
concurrency:
  group: mirror-to-codeberg
  cancel-in-progress: false

jobs:
  mirror_to_codeberg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Codeberg
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@codeberg.org:pavnxet/yt-timestamp-skipper.git
          ssh_private_key:
            ${{ secrets.CODEBERG_SSH_KEY }}
