name: Mirror to Codeberg

# Automatic mirroring is OFF.
# Codeberg's registrar put codeberg.org on clientHold on 18 Nov 2026, so the
# domain stopped resolving and every push turned this job red with
# "Could not resolve hostname codeberg.org".
# Run it by hand from the Actions tab once Codeberg is reachable again, then
# restore the push trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

# Two mirror runs at once race on the target's refs and one fails with
# "incorrect old value provided". Serialise them; never cancel a running mirror.
concurrency:
  group: mirror-to-codeberg
  cancel-in-progress: false

jobs:
  mirror_to_codeberg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Codeberg
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@codeberg.org:pavnxet/yt-timestamp-skipper.git
          ssh_private_key:
            ${{ secrets.CODEBERG_SSH_KEY }}
