name: Update docs
on:
  push:
    paths:
      - '.github/workflows/apply-pending-patch.yml'
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write README
        run: echo '' | base64 -d | gunzip > README.md
      - name: Write docs page
        run: echo '' | base64 -d | gunzip > docs/index.html
      - name: Commit and remove this one-shot workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html
          git rm -q .github/workflows/apply-pending-patch.yml
          git commit -m "docs: update README and landing page for v3.5.2"
          git push
