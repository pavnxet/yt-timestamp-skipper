name: Apply pending patch
on:
  push:
    paths:
      - '.github/workflows/apply-pending-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -e
          cat .github/t1.b64 .github/t2.b64 | base64 -d | gunzip > /tmp/apply.py
          python3 /tmp/apply.py
          node --check content.js

      - name: Commit and remove the one-shot workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js content.css manifest.json
          git rm -q .github/workflows/apply-pending-patch.yml .github/t1.b64 .github/t2.b64
          git commit -m "fix(chapters): marker tooltip now shows the chapter timestamp alongside its name (v3.8.1)"
          git push
