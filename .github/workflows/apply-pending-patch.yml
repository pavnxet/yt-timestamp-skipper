name: Apply pending patch
on:
  push:
    paths:
      - '.github/workflows/apply-pending-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Commit and remove this one-shot workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js manifest.json
          git rm -q .github/workflows/apply-pending-patch.yml
          git commit -m "fix(embed): wait for the player to appear and report missing transcripts (v3.5.1)"
          git push
