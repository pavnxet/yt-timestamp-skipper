name: Adopt agent template
on:
  push:
    paths:
      - '.github/workflows/adopt-agent-template.yml'
permissions:
  contents: write
jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the template
        run: |
          set -e
          git clone --depth 1 https://github.com/pavnxet/learnings-for-agents /tmp/tpl

      - name: Copy the scaffolding
        run: |
          set -e
          cp /tmp/tpl/AGENTS.md .
          mkdir -p learning/archive learning/topics .githooks
          cp /tmp/tpl/learning/*.md learning/
          touch learning/archive/.gitkeep learning/topics/.gitkeep
          cp /tmp/tpl/scripts/scan_sensitive.py /tmp/tpl/scripts/setup.sh /tmp/tpl/scripts/setup.ps1 scripts/
          cp /tmp/tpl/.githooks/* .githooks/
          chmod +x .githooks/* scripts/setup.sh scripts/scan_sensitive.py

      - name: Apply the project tailoring
        run: |
          set -e
          cat .github/a1.b64 .github/a2.b64 .github/a3.b64 | base64 -d | gunzip > /tmp/tailor.py
          python3 /tmp/tailor.py
          python3 -c "import ast; ast.parse(open('scripts/scan_sensitive.py').read())"
          grep -q 'YT Smart Chapters Pro' AGENTS.md

      - name: Commit and remove this one-shot workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md learning scripts .githooks .env.example .gitignore
          git rm -q .github/workflows/adopt-agent-template.yml .github/a1.b64 .github/a2.b64 .github/a3.b64
          git commit -m "chore: adopt the learnings-for-agents memory + safety template"
          git push
