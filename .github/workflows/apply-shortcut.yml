name: Apply shortcut patch
on:
  push:
    paths:
      - '.github/workflows/apply-shortcut.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: |
          set -e
          cat .github/s1.b64 .github/s2.b64 .github/s3.b64 | base64 -d | gunzip > /tmp/p.py
          python3 /tmp/p.py
          node --check content.js

      - name: Verify before committing
        run: |
          set -e
          python3 scripts/scan_sensitive.py --all
          python3 -c "import json; assert json.load(open('manifest.json'))['version'] == '3.9.1'"
          grep -q 'yt-sk-sc-toggle' content.js
          grep -q 'recordingShortcut' content.js

      - name: Commit and remove this one-shot workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js manifest.json CHANGELOG.md docs/keyboard-shortcuts.md
          git rm -q .github/workflows/apply-shortcut.yml .github/s1.b64 .github/s2.b64 .github/s3.b64
          git commit -m "feat(shortcuts): Alt+M toggles the panel, editable like the rest (v3.9.1)"
          git push
