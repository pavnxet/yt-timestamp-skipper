name: Apply 3.9.0
on:
  push:
    paths:
      - '.github/workflows/apply-390.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: |
          set -e
          cat .github/d1.b64 .github/d2.b64 .github/d3.b64 .github/d4.b64 .github/d5.b64 \
              .github/d6.b64 .github/d7.b64 .github/d8.b64 .github/d9.b64 \
            | base64 -d | gunzip > /tmp/a.py
          python3 /tmp/a.py
          node --check background.js

      - name: Verify before committing
        run: |
          set -e
          python3 scripts/scan_sensitive.py --all
          python3 -c "import json; assert json.load(open('manifest.json'))['version'] == '3.9.0'"
          grep -q 'Use my own AI API' docs/configuration.md

      - name: Commit and remove this one-shot workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js manifest.json CHANGELOG.md README.md docs
          git rm -q .github/workflows/apply-390.yml \
                     .github/d1.b64 .github/d2.b64 .github/d3.b64 .github/d4.b64 .github/d5.b64 \
                     .github/d6.b64 .github/d7.b64 .github/d8.b64 .github/d9.b64
          git commit -m "feat!: drop the shared transcript key; rewrite docs and landing page (v3.9.0)"
          git push
